services:

  # Base de données PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: ayyou_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ayyou}
      POSTGRES_USER: ${POSTGRES_USER:-ayyou}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ayyou_mot_de_passe_prod_2026}
    volumes:
      # Les données Postgres survivent aux redémarrages et rebuilds du conteneur
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ayyou} -d ${POSTGRES_DB:-ayyou}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # API Django
  backend:
    build:
      context: ./ayyouBackend
      dockerfile: Dockerfile
    container_name: ayyou_backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
      - path: ./ayyouBackend/.env
        required: false
      - path: ../.env
        required: false
    environment:
      # Pointeur automatique vers le conteneur PostgreSQL "db"
      DATABASE_URL: postgresql://${POSTGRES_USER:-ayyou}:${POSTGRES_PASSWORD:-ayyou_mot_de_passe_prod_2026}@db:5432/${POSTGRES_DB:-ayyou}
      AYYOU_SERVICE_IA_URL: http://service-ia:8000
    ports:
      - "8888:8000"
    volumes:
      # Les médias téléversés survivent aux rebuilds
      - media_data:/app/medias
    depends_on:
      db:
        condition: service_healthy
      service-ia:
        condition: service_started

  # Application Angular (Frontend)
  frontend:
    build:
      context: ./ayyouFrontend
      dockerfile: Dockerfile
    container_name: ayyou_frontend
    restart: unless-stopped
    ports:
      - "2401:80"
    depends_on:
      - backend

  # Microservice IA (FastAPI)
  service-ia:
    build:
      context: ./ayyouServiceIA
      dockerfile: Dockerfile
    container_name: ayyou_service_ia
    restart: unless-stopped
    ports:
      - "8881:8000"

volumes:
  postgres_data:
    name: ayyou_postgres_data
  media_data:
    name: ayyou_media_data
