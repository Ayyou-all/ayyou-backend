# ==============================================================================
# CONFIGURATION REVERSE PROXY NGINX SUR LE SERVEUR VPS LWS
# ==============================================================================
# Emplacement sur le VPS : /etc/nginx/sites-available/ayyou
# Activation : sudo ln -s /etc/nginx/sites-available/ayyou /etc/nginx/sites-enabled/
# Test : sudo nginx -t
# Rechargement : sudo systemctl reload nginx
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. FRONTEND ANGULAR : https://ayyou.site
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ayyou.site www.ayyou.site;

    # Redirection automatique HTTP vers HTTPS gérée par Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ayyou.site www.ayyou.site;

    # Chemins des certificats Let's Encrypt (générés par Certbot)
    ssl_certificate /etc/letsencrypt/live/ayyou.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ayyou.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Limite de taille de téléversement
    client_max_body_size 200M;

    location / {
        # Redirection vers le conteneur Frontend Angular (Port VPS 2401)
        proxy_pass http://127.0.0.1:2401;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# ------------------------------------------------------------------------------
# 2. BACKEND DJANGO REST FRAMEWORK : https://api.ayyou.site
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.ayyou.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.ayyou.site;

    # Chemins des certificats Let's Encrypt pour l'API
    ssl_certificate /etc/letsencrypt/live/api.ayyou.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ayyou.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Autorise le téléversement de photos et vidéos culinaires
    client_max_body_size 200M;

    location / {
        # Redirection vers le conteneur Backend Django / Gunicorn (Port VPS 8888)
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSockets et connexions persistantes
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Délais adaptés aux calculs IA et aux requêtes complexes
        proxy_connect_timeout 120s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
