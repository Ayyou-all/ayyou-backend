# ==============================================================================
# CONFIGURATION REVERSE PROXY NGINX - VPS LWS
# Domaine principal : ayyou.site
# API Django : api.ayyou.site
# ==============================================================================


# ------------------------------------------------------------------------------
# 1. FRONTEND ANGULAR : HTTP -> HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    server_name ayyou.site www.ayyou.site;

    # Validation Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirection HTTP vers HTTPS
    location / {
        return 301 https://hostrequest_uri;
    }
}


# ------------------------------------------------------------------------------
# 2. FRONTEND ANGULAR : HTTPS
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    http2 on;

    server_name ayyou.site www.ayyou.site;

    # Certificat Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/ayyou.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ayyou.site/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Taille maximale des requêtes
    client_max_body_size 200M;

    location / {
        # Frontend Angular
        proxy_pass http://127.0.0.1:2401;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}


# ------------------------------------------------------------------------------
# 3. API DJANGO : HTTP -> HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    server_name api.ayyou.site;

    # Validation Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirection HTTP vers HTTPS
    location / {
        return 301 https://hostrequest_uri;
    }
}


# ------------------------------------------------------------------------------
# 4. API DJANGO REST FRAMEWORK : HTTPS
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    http2 on;

    server_name api.ayyou.site;

    # Certificat couvrant api.ayyou.site
    ssl_certificate /etc/letsencrypt/live/ayyou.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ayyou.site/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Taille maximale des requêtes API
    client_max_body_size 200M;

    location / {
        # Backend Django / Gunicorn
        proxy_pass http://127.0.0.1:8888;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Connexions persistantes et WebSockets, si nécessaires
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Délais adaptés aux requêtes longues
        proxy_connect_timeout 120s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
